<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunningHub AI Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎨</span>
                <h1>RunningHub AI Studio</h1>
            </div>
            <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
        </header>

        <!-- Main Content -->
        <main class="main-content simple-layout">
            <!-- Left Panel - Controls -->
            <section class="controls-section full-width">
                <div class="control-group">
                    <label for="workflowInput">Workflow ID</label>
                    <input type="text" id="workflowInput" value="2013462841914826753">
                </div>

                <!-- Dynamic Workflow Import -->
                <div class="workflow-import-section">
                    <button class="import-json-btn primary" id="importJsonBtn">
                        📋 Import Workflow JSON
                    </button>
                    <p class="import-hint">Paste workflow JSON để tự động tạo UI controls</p>
                </div>

                <!-- Workflow Parameters Panel (shown after import) -->
                <div class="workflow-params-panel hidden" id="workflowParamsPanel">
                    <div class="params-header">
                        <span class="params-title">📋 Workflow Parameters</span>
                        <button class="params-clear" id="clearParamsBtn" title="Clear">✕</button>
                    </div>
                    <div class="params-container" id="mainParamsContainer">
                        <!-- Dynamic parameters will be rendered here -->
                    </div>
                </div>

                <button class="generate-btn" id="generateBtn">
                    <span class="btn-icon">🚀</span>
                    <span class="btn-text">Generate</span>
                </button>

                <!-- Status -->
                <div class="status-container hidden" id="statusContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="status-info">
                        <span id="statusText">Processing...</span>
                        <span id="statusTimer">0.0s</span>
                    </div>
                </div>
            </section>

            <!-- Right Panel - Results -->
            <section class="results-section">
                <div class="results-header">
                    <h2>Results</h2>
                    <div class="results-stats">
                        <span id="totalResults">0 images</span>
                        <span class="separator">•</span>
                        <span id="totalTime">0s total</span>
                    </div>
                </div>
                <div class="results-grid" id="resultsGrid">
                    <div class="empty-state" id="emptyState">
                        <span>✨</span>
                        <p>Generated images will appear here</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Settings Modal -->
        <div class="modal hidden" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Settings</h3>
                    <button class="close-btn" id="closeModalBtn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="control-group">
                        <label for="apiKeyInput">API Key</label>
                        <input type="password" id="apiKeyInput" placeholder="Enter your RunningHub API Key">
                    </div>
                    <button class="save-btn" id="saveSettingsBtn">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import JSON Modal -->
    <div class="modal hidden" id="importJsonModal">
        <div class="modal-overlay">
            <div class="modal-content modal-lg modal-full-height">
                <div class="modal-header">
                    <h3>📋 Import Workflow JSON</h3>
                    <button class="close-btn" id="closeImportBtn">✕</button>
                </div>
                <div class="modal-body modal-scrollable">
                    <div class="control-group">
                        <label for="workflowJson">Paste Workflow JSON (API Format)</label>
                        <textarea id="workflowJson" rows="8"
                            placeholder='{"1": {"inputs": {...}, "class_type": "..."}, ...}'></textarea>
                    </div>
                    <div class="detected-nodes hidden" id="detectedNodes">
                        <h4>🔍 Detected Nodes:</h4>
                        <div id="detectedList"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="analyze-btn" id="analyzeJsonBtn">🔍 Analyze Workflow</button>
                    <button class="apply-btn" id="applyNodesBtn">✅ Apply to Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
